<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Login Callback — Tennis Lab</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #1a1a2e; background: #fff; }
  h1 { color: #0d1b33; font-size: 1.4em; }
  .box { background: #f4f4f8; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; word-break: break-all; font-family: monospace; }
  .label { font-weight: bold; color: #0d1b33; margin-top: 20px; }
  button { margin-top: 10px; padding: 8px 16px; background: #0d1b33; color: #d4af37; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<h1>TikTok login complete</h1>
<p>Copy the values below back into the terminal to finish connecting the account.</p>

<div class="label">code:</div>
<div class="box" id="code">(none found in URL)</div>
<button onclick="copyField('code')">Copy code</button>

<div class="label">state:</div>
<div class="box" id="state">(none found in URL)</div>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('code').textContent = params.get('code') || '(none found in URL)';
  document.getElementById('state').textContent = params.get('state') || '(none found in URL)';

  function copyField(id) {
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text);
  }
</script>
</body>
</html>
